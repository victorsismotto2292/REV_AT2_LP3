<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title style="text-align: center;">
      Teste 1 - Valores entre Telas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="padding: 20px">
  <ion-item>
    <ion-input type="text" labelPlacement="floating" label="Nome" placeholder="Nome:" [(ngModel)]="nome" style="max-width: 200px;"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input type="email" labelPlacement="floating" label="Email:" [(ngModel)]="email" style="max-width: 200px;"></ion-input>
  </ion-item>

  <ion-item style="margin-bottom: 10px">
    <ion-input type="text" labelPlacement="floating" label="Telefone:" [(ngModel)]="telefone" style="max-width: 200px;"></ion-input>
  </ion-item>

  <ion-button expand="block" style="max-width: 100px;" (click)="abrirTela()">Cadastrar</ion-button>
</ion-content>
